<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Katarzyna Stańczyk GitHub banner</title>
  <desc id="desc">Animated GitHub banner with soft floating glow clouds, dots and sparkles.</desc>

  <defs>
    <!-- soft glow clouds -->
    <radialGradient id="glowLeft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.28"></stop>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"></stop>
    </radialGradient>

    <radialGradient id="glowRight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.22"></stop>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0"></stop>
    </radialGradient>

    <radialGradient id="glowCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.16"></stop>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0"></stop>
    </radialGradient>

    <!-- badge glass -->
    <linearGradient id="badgeStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.95"></stop>
      <stop offset="50%" stop-color="#E879F9" stop-opacity="0.75"></stop>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.95"></stop>
    </linearGradient>

    <linearGradient id="badgeFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A163F" stop-opacity="0.64"></stop>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.44"></stop>
    </linearGradient>

    <filter id="softBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"></feGaussianBlur>
    </filter>

    <filter id="textGlow" x="-30%" y="-50%" width="160%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#C084FC" flood-opacity="0.15"></feDropShadow>
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#60A5FA" flood-opacity="0.08"></feDropShadow>
    </filter>

    <filter id="badgeGlow" x="-35%" y="-60%" width="170%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#A78BFA" flood-opacity="0.32"></feDropShadow>
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#E879F9" flood-opacity="0.12"></feDropShadow>
    </filter>

    <filter id="sparkGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="1.1" result="b"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="b"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>

    <g id="xSpark" stroke="#D8B4FE" stroke-width="1.8" stroke-linecap="round">
      <path d="M-7 -7 L7 7"></path>
      <path d="M7 -7 L-7 7"></path>
    </g>
  </defs>

  <!-- animated glow clouds -->
  <g opacity="0.95">
    <ellipse cx="180" cy="145" rx="190" ry="105" fill="url(#glowLeft)" filter="url(#softBlur)">
      <animate attributeName="cx" values="180;205;180" dur="10s" repeatCount="indefinite"></animate>
      <animate attributeName="cy" values="145;136;145" dur="10s" repeatCount="indefinite"></animate>
      <animate attributeName="rx" values="190;205;190" dur="10s" repeatCount="indefinite"></animate>
      <animate attributeName="opacity" values="0.78;1;0.78" dur="10s" repeatCount="indefinite"></animate>
    </ellipse>

    <ellipse cx="1025" cy="140" rx="200" ry="110" fill="url(#glowRight)" filter="url(#softBlur)">
      <animate attributeName="cx" values="1025;995;1025" dur="12s" repeatCount="indefinite"></animate>
      <animate attributeName="cy" values="140;148;140" dur="12s" repeatCount="indefinite"></animate>
      <animate attributeName="rx" values="200;215;200" dur="12s" repeatCount="indefinite"></animate>
      <animate attributeName="opacity" values="0.74;1;0.74" dur="12s" repeatCount="indefinite"></animate>
    </ellipse>

    <ellipse cx="600" cy="235" rx="165" ry="72" fill="url(#glowCenter)" filter="url(#softBlur)">
      <animate attributeName="cy" values="235;220;235" dur="8s" repeatCount="indefinite"></animate>
      <animate attributeName="rx" values="165;178;165" dur="8s" repeatCount="indefinite"></animate>
      <animate attributeName="opacity" values="0.50;0.80;0.50" dur="8s" repeatCount="indefinite"></animate>
    </ellipse>
  </g>

  <!-- floating dots -->
  <g filter="url(#sparkGlow)">
    <circle cx="126" cy="98" r="5" fill="#A78BFA">
      <animate attributeName="cy" values="98;106;98" dur="6.2s" repeatCount="indefinite"></animate>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3.2s" repeatCount="indefinite"></animate>
    </circle>

    <circle cx="1045" cy="92" r="3.2" fill="#60A5FA">
      <animate attributeName="cy" values="92;84;92" dur="5.5s" repeatCount="indefinite"></animate>
      <animate attributeName="opacity" values="0.22;0.95;0.22" dur="3.6s" repeatCount="indefinite"></animate>
    </circle>

    <circle cx="1090" cy="204" r="4.5" fill="#C084FC">
      <animate attributeName="cy" values="204;194;204" dur="6.8s" repeatCount="indefinite"></animate>
      <animate attributeName="opacity" values="0.25;0.95;0.25" dur="4.1s" repeatCount="indefinite"></animate>
    </circle>

    <circle cx="528" cy="58" r="3.8" fill="#F472B6">
      <animate attributeName="cy" values="58;66;58" dur="5.9s" repeatCount="indefinite"></animate>
      <animate attributeName="opacity" values="0.20;0.90;0.20" dur="3.1s" repeatCount="indefinite"></animate>
    </circle>

    <circle cx="394" cy="228" r="4.1" fill="#F472B6">
      <animate attributeName="cy" values="228;218;228" dur="6.4s" repeatCount="indefinite"></animate>
      <animate attributeName="opacity" values="0.24;0.92;0.24" dur="3.8s" repeatCount="indefinite"></animate>
    </circle>

    <circle cx="822" cy="220" r="3.9" fill="#A78BFA">
      <animate attributeName="cy" values="220;229;220" dur="6.7s" repeatCount="indefinite"></animate>
      <animate attributeName="opacity" values="0.20;0.88;0.20" dur="3.4s" repeatCount="indefinite"></animate>
    </circle>
  </g>

  <!-- x sparkles -->
  <g filter="url(#sparkGlow)" opacity="0.8">
    <g transform="translate(250 190)">
      <use href="#xSpark"></use>
      <animateTransform attributeName="transform" type="translate" values="250 190;262 180;250 190" dur="7.5s" repeatCount="indefinite"></animateTransform>
      <animateTransform attributeName="transform" additive="sum" type="rotate" values="0;22;0" dur="7.5s" repeatCount="indefinite"></animateTransform>
      <animate attributeName="opacity" values="0.18;0.85;0.18" dur="4.2s" repeatCount="indefinite"></animate>
    </g>

    <g transform="translate(958 196)">
      <use href="#xSpark"></use>
      <animateTransform attributeName="transform" type="translate" values="958 196;946 184;958 196" dur="7.2s" repeatCount="indefinite"></animateTransform>
      <animateTransform attributeName="transform" additive="sum" type="rotate" values="0;-20;0" dur="7.2s" repeatCount="indefinite"></animateTransform>
      <animate attributeName="opacity" values="0.16;0.90;0.16" dur="3.9s" repeatCount="indefinite"></animate>
    </g>

    <g transform="translate(780 76) scale(0.82)">
      <use href="#xSpark"></use>
      <animateTransform attributeName="transform" type="translate" values="780 76;792 68;780 76" dur="8.3s" repeatCount="indefinite"></animateTransform>
      <animateTransform attributeName="transform" additive="sum" type="rotate" values="0;28;0" dur="8.3s" repeatCount="indefinite"></animateTransform>
      <animate attributeName="opacity" values="0.10;0.65;0.10" dur="5s" repeatCount="indefinite"></animate>
    </g>
  </g>

  <!-- name -->
  <text x="600" y="130" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="74" font-weight="800" letter-spacing="0.5" fill="#F1EAFE" filter="url(#textGlow)">
    Katarzyna Stańczyk
  </text>

  <!-- glass badge -->
  <g filter="url(#badgeGlow)">
    <rect x="392" y="170" width="416" height="64" rx="32" fill="url(#badgeFill)" stroke="url(#badgeStroke)" stroke-width="1.8">
      <animate attributeName="opacity" values="0.96;1;0.96" dur="4.6s" repeatCount="indefinite"></animate>
    </rect>

    <text x="462" y="211" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#EEDBFF">
      &lt;/&gt;
    </text>

    <line x1="510" y1="183" x2="510" y2="221" stroke="#E9D5FF" stroke-opacity="0.7" stroke-width="1.5"></line>

    <text x="644" y="211" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#F3E8FF">
      .NET Developer
    </text>
  </g>
</svg>