name: Generate Pac-Man Contribution Graph

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Generate Pac-Man SVG
        uses: abozanona/pacman-contribution-graph@v5.0.0
        with:
          github_user_name: Avuii
          games: "pacman"
          player_style: "opportunistic"
          hide_month_labels: "false"

      - name: Customize full grid, typography and legend
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          import re
          import xml.etree.ElementTree as ET
          
          NS = 'http://www.w3.org/2000/svg'
          ET.register_namespace('', NS)
          Q = lambda tag: f'{{{NS}}}{tag}'
          FONT = 'Segoe UI, Helvetica, Arial, sans-serif'
          BG = '#0D1117'
          EMPTY = '#1E1B2E'
          PALETTE = ['#1E1B2E', '#2A163F', '#6D28D9', '#A78BFA', '#E879F9']
          # These are the output shades produced by the generator before customization.
          COLOR_MAP = {
              '#161b22': EMPTY,
              '#0e4429': '#2A163F',
              '#006d32': '#6D28D9',
              '#26a641': '#A78BFA',
              '#39d353': '#E879F9',
              '#9be9a8': '#F0ABFC',
              '#216e39': '#8B5CF6',
              '#30a14e': '#C084FC',
              '#40c463': '#E879F9',
          }
          
          for path in Path('dist').glob('*.svg'):
              root = ET.parse(path).getroot()
              width = float(root.get('width', '1166'))
              height = float(root.get('height', '184'))
          
              # The generator has 371 cells with IDs c-week-day.
              cells = [el for el in root.iter(Q('rect'))
                       if re.fullmatch(r'c-\d+-[0-6]', el.get('id', ''))]
              if len(cells) != 371:
                  raise RuntimeError(f'Expected 371 contribution cells, got {len(cells)} in {path}')
          
              # Color only grid cells. The background stays dark.
              # Crucially, modify animation values as well, so the board remains visible
              # when Pac-Man eats a contribution.
              for cell in cells:
                  fill = cell.get('fill', BG)
                  cell.set('fill', EMPTY if fill.lower() == BG.lower()
                           else COLOR_MAP.get(fill.lower(), fill))
                  for animate in cell.findall(Q('animate')):
                      if animate.get('attributeName') == 'fill':
                          values = animate.get('values', '')
                          values = re.sub(r'#[0-9A-Fa-f]{6}',
                              lambda m: EMPTY if m.group(0).lower() == BG.lower()
                              else COLOR_MAP.get(m.group(0).lower(), m.group(0)),
                              values)
                          animate.set('values', values)
          
              # The input SVG already has customized purple shades in its animations;
              # they are preserved. Apply the font explicitly to text nodes.
              for item in root.iter():
                  if item.tag in (Q('text'), Q('tspan')):
                      item.set('font-family', FONT)
                      item.set('font-size', item.get('font-size', '11'))
                      item.set('fill', '#CBD5E1')
          
              # Give extra space to weekday labels and a footer while retaining all
              # existing Pac-Man coordinates and animations within a shifted group.
              left, top, bottom = 48, 22, 40
              root.set('width', str(int(width + left)))
              root.set('height', str(int(height + top + bottom)))
              root.set('viewBox', f'0 0 {int(width + left)} {int(height + top + bottom)}')
          
              original_children = list(root)
              for child in original_children:
                  root.remove(child)
          
              backdrop = ET.SubElement(root, Q('rect'), {
                  'width': '100%', 'height': '100%', 'fill': BG
              })
              # Keep defs and metadata at root; all visible/animated artwork is grouped.
              layer = ET.Element(Q('g'), {'transform': f'translate({left},{top})'})
              for child in original_children:
                  if child.tag in (Q('defs'), Q('metadata'), Q('desc')):
                      root.append(child)
                  elif child.tag == Q('rect') and child.get('width') == '100%':
                      continue  # replace old backdrop
                  else:
                      layer.append(child)
              root.append(layer)
          
              for label, index in [('Mon', 1), ('Wed', 3), ('Fri', 5)]:
                  text = ET.SubElement(root, Q('text'), {
                      'x': '7', 'y': str(top + 15 + 22 * index + 14),
                      'font-family': FONT, 'font-size': '12', 'fill': '#CBD5E1'
                  })
                  text.text = label
          
              now = datetime.now(timezone.utc).date()
              prior = now - timedelta(days=364)
              years = str(now.year) if now.year == prior.year else f'{prior.year}–{now.year}'
              footer_y = top + height + 22
              year = ET.SubElement(root, Q('text'), {
                  'x': str(left), 'y': str(int(footer_y)), 'font-family': FONT,
                  'font-size': '12', 'fill': '#C4B5FD'
              })
              year.text = years
          
              legend_x = left + width - 177
              less = ET.SubElement(root, Q('text'), {
                  'x': str(int(legend_x)), 'y': str(int(footer_y)),
                  'font-family': FONT, 'font-size': '12', 'fill': '#94A3B8'
              })
              less.text = 'Less'
              for i, color in enumerate(PALETTE):
                  ET.SubElement(root, Q('rect'), {
                      'x': str(int(legend_x + 35 + i * 15)),
                      'y': str(int(footer_y - 11)),
                      'width': '12', 'height': '12', 'rx': '2', 'fill': color
                  })
              more = ET.SubElement(root, Q('text'), {
                  'x': str(int(legend_x + 120)), 'y': str(int(footer_y)),
                  'font-family': FONT, 'font-size': '12', 'fill': '#94A3B8'
              })
              more.text = 'More'
          
              ET.ElementTree(root).write(path, encoding='utf-8', xml_declaration=True)
              print(f'Customized {path} with {len(cells)} visible cells')
          PY

      - name: Publish SVG
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
