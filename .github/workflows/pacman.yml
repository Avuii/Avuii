
name: Generate Pac-Man Contribution Graph

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate Pac-Man SVG
        uses: abozanona/pacman-contribution-graph@v5.0.0
        with:
          github_user_name: Avuii
          games: "pacman"
          player_style: "opportunistic"
          hide_month_labels: "false"

      - name: Apply custom colors and GitHub font
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          FONT = (
              '-apple-system, BlinkMacSystemFont, '
              '"Segoe UI", Helvetica, Arial, sans-serif'
          )

          COLORS = {
              "#161b22": "#0D1117",
              "#0d1117": "#0D1117",
              "#0e4429": "#2A163F",
              "#006d32": "#6D28D9",
              "#26a641": "#A78BFA",
              "#39d353": "#E879F9",
              "#9be9a8": "#F0ABFC",
              "#216e39": "#8B5CF6",
              "#30a14e": "#C084FC",
              "#40c463": "#E879F9",
          }

          svg_files = list(Path("dist").glob("*.svg"))

          if not svg_files:
              raise RuntimeError("No SVG files found in dist/")

          for path in svg_files:
              content = path.read_text(encoding="utf-8")

              # Replace GitHub colors with custom palette
              for old, new in COLORS.items():
                  content = re.sub(
                      re.escape(old),
                      lambda match, color=new: color,
                      content,
                      flags=re.IGNORECASE
                  )

              # Force GitHub-style sans-serif typography
              # for month labels and all SVG text
              font_style = (
                  '<style type="text/css">'
                  'text, tspan {'
                  f'font-family: {FONT} !important;'
                  '}'
                  '</style>'
              )

              # Append CSS at the end of the SVG
              # to override previously defined styles
              content, count = re.subn(
                  r'</svg\s*>',
                  lambda match: font_style + match.group(0),
                  content,
                  count=1,
                  flags=re.IGNORECASE
              )

              if count != 1:
                  raise RuntimeError(
                      f"SVG closing tag not found: {path}"
                  )

              path.write_text(
                  content,
                  encoding="utf-8"
              )

              print(f"Customized SVG: {path}")

          print("SVG customization complete.")
          PY

      - name: Publish SVG
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
