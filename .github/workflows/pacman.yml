
name: Generate Pac-Man Contribution Graph

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate Pac-Man SVG
        uses: abozanona/pacman-contribution-graph@v5.0.0
        with:
          github_user_name: Avuii
          games: "pacman"
          player_style: "opportunistic"
          hide_month_labels: "false"

      - name: Apply custom GitHub theme
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          import re
          import xml.etree.ElementTree as ET

          SVG_NS = "http://www.w3.org/2000/svg"
          ET.register_namespace("", SVG_NS)

          FONT = (
              '-apple-system, BlinkMacSystemFont, '
              '"Segoe UI", Helvetica, Arial, sans-serif'
          )

          COLORS = {
              "#0d1117": "#0D1117",
              "#161b22": "#1E1B2E",
              "#0e4429": "#2A163F",
              "#006d32": "#6D28D9",
              "#26a641": "#A78BFA",
              "#39d353": "#E879F9",
              "#9be9a8": "#F0ABFC",
              "#216e39": "#8B5CF6",
              "#30a14e": "#C084FC",
              "#40c463": "#E879F9",
          }

          PALETTE = [
              "#1E1B2E",
              "#2A163F",
              "#6D28D9",
              "#A78BFA",
              "#E879F9",
          ]

          files = list(Path("dist").glob("*.svg"))

          if not files:
              raise RuntimeError("No SVG files found in dist/")

          def svg_element(name, attrs=None):
              return ET.Element(
                  f"{{{SVG_NS}}}{name}",
                  attrs or {}
              )

          for path in files:
              content = path.read_text(encoding="utf-8")

              # 1. Replace default GitHub contribution colors
              for old, new in COLORS.items():
                  content = re.sub(
                      re.escape(old),
                      lambda match, c=new: c,
                      content,
                      flags=re.IGNORECASE
                  )

              # 2. Parse SVG
              root = ET.fromstring(content)

              # 3. Apply GitHub sans-serif typography
              style = svg_element("style")
              style.text = (
                  "text, tspan {"
                  f"font-family: {FONT} !important;"
                  "}"
              )
              root.append(style)

              # 4. Apply font to text elements
              for element in root.iter():
                  if element.tag in (
                      f"{{{SVG_NS}}}text",
                      f"{{{SVG_NS}}}tspan"
                  ):
                      element.set("font-family", FONT)

              # 5. Read SVG dimensions
              viewbox = root.get("viewBox")

              if viewbox:
                  values = [
                      float(v)
                      for v in re.split(
                          r"[\s,]+", viewbox.strip()
                      )
                  ]
                  min_x, min_y, width, height = values
              else:
                  width = float(
                      re.sub(
                          r"[^0-9.]",
                          "",
                          root.get("width", "900")
                      )
                  )
                  height = float(
                      re.sub(
                          r"[^0-9.]",
                          "",
                          root.get("height", "200")
                      )
                  )
                  min_x, min_y = 0, 0

              # 6. Add footer space for year and legend
              footer_height = 35

              root.set(
                  "viewBox",
                  f"{min_x} {min_y} "
                  f"{width} {height + footer_height}"
              )

              root.set(
                  "height",
                  str(height + footer_height)
              )

              # 7. Calculate rolling 12-month year range
              today = datetime.now(timezone.utc).date()
              previous = today - timedelta(days=364)

              years = (
                  str(today.year)
                  if previous.year == today.year
                  else f"{previous.year}–{today.year}"
              )

              footer_y = min_y + height + 23

              # 8. Year label
              year_text = svg_element("text", {
                  "x": str(min_x + 8),
                  "y": str(footer_y),
                  "fill": "#C4B5FD",
                  "font-size": "12",
                  "font-family": FONT
              })
              year_text.text = years
              root.append(year_text)

              # 9. Contribution legend
              legend = svg_element("g")

              legend_x = min_x + width - 155

              less = svg_element("text", {
                  "x": str(legend_x),
                  "y": str(footer_y),
                  "fill": "#94A3B8",
                  "font-size": "11",
                  "font-family": FONT
              })
              less.text = "Less"
              legend.append(less)

              for i, color in enumerate(PALETTE):
                  rect = svg_element("rect", {
                      "x": str(legend_x + 29 + i * 15),
                      "y": str(footer_y - 10),
                      "width": "11",
                      "height": "11",
                      "rx": "2",
                      "fill": color
                  })
                  legend.append(rect)

              more = svg_element("text", {
                  "x": str(legend_x + 108),
                  "y": str(footer_y),
                  "fill": "#94A3B8",
                  "font-size": "11",
                  "font-family": FONT
              })
              more.text = "More"
              legend.append(more)

              root.append(legend)

              # 10. Save customized SVG
              tree = ET.ElementTree(root)

              tree.write(
                  path,
                  encoding="utf-8",
                  xml_declaration=True
              )

              print(f"Customized: {path}")

          print("All SVG files customized successfully.")
          PY

      - name: Publish SVG
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
