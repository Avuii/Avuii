
name: Generate Pac-Man Contribution Graph

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NODE_OPTIONS: "--max-old-space-size=6144"

    steps:
      - name: Generate Pac-Man SVG
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: Avuii
          games: "pacman"
          player_style: "opportunistic"
          hide_month_labels: "false"

      - name: Verify generated SVG files
        shell: bash
        run: |
          ls -lah dist/
          test -n "$(find dist -maxdepth 1 -name '*.svg' -print -quit)"

      - name: Customize full grid, typography and legend
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          import re
          import xml.etree.ElementTree as ET

          NS = 'http://www.w3.org/2000/svg'
          ET.register_namespace('', NS)

          def Q(tag):
              return f'{{{NS}}}{tag}'

          FONT = 'Segoe UI, Helvetica, Arial, sans-serif'
          BG = '#0D1117'
          EMPTY = '#1E1B2E'

          PALETTE = [
              '#1E1B2E',
              '#2A163F',
              '#6D28D9',
              '#A78BFA',
              '#E879F9'
          ]

          COLOR_MAP = {
              '#161b22': EMPTY,
              '#0d1117': EMPTY,
              '#0e4429': '#2A163F',
              '#006d32': '#6D28D9',
              '#26a641': '#A78BFA',
              '#39d353': '#E879F9',
              '#9be9a8': '#F0ABFC',
              '#216e39': '#8B5CF6',
              '#30a14e': '#C084FC',
              '#40c463': '#E879F9',
          }

          paths = list(Path('dist').glob('*.svg'))

          if not paths:
              raise RuntimeError('No SVG files generated')

          for path in paths:
              tree = ET.parse(path)
              root = tree.getroot()

              width = float(root.get('width', '1166').replace('px', ''))
              height = float(root.get('height', '184').replace('px', ''))

              cells = [
                  el for el in root.iter(Q('rect'))
                  if re.fullmatch(
                      r'c-\d+-[0-6]',
                      el.get('id', '')
                  )
              ]

              if len(cells) != 371:
                  raise RuntimeError(
                      f'Expected 371 cells, got {len(cells)} in {path}'
                  )

              def recolor(value):
                  if not value:
                      return value
                  key = value.lower()
                  return COLOR_MAP.get(key, value)

              for cell in cells:
                  fill = cell.get('fill', BG)
                  cell.set('fill', recolor(fill))

                  for animate in cell.findall(Q('animate')):
                      if animate.get('attributeName') == 'fill':
                          values = animate.get('values', '')
                          values = re.sub(
                              r'#[0-9A-Fa-f]{6}',
                              lambda m: recolor(m.group(0)),
                              values
                          )
                          animate.set('values', values)

              for item in root.iter():
                  if item.tag in (Q('text'), Q('tspan')):
                      item.set('font-family', FONT)
                      item.set(
                          'font-size',
                          item.get('font-size', '11')
                      )
                      item.set('fill', '#CBD5E1')

              left, top, bottom = 48, 22, 40

              root.set('width', str(int(width + left)))
              root.set('height', str(int(height + top + bottom)))
              root.set(
                  'viewBox',
                  f'0 0 {int(width + left)} {int(height + top + bottom)}'
              )

              original_children = list(root)

              for child in original_children:
                  root.remove(child)

              ET.SubElement(root, Q('rect'), {
                  'width': '100%',
                  'height': '100%',
                  'fill': BG
              })

              layer = ET.Element(
                  Q('g'),
                  {'transform': f'translate({left},{top})'}
              )

              for child in original_children:
                  if child.tag in (
                      Q('defs'), Q('metadata'), Q('desc')
                  ):
                      root.append(child)
                  elif (
                      child.tag == Q('rect')
                      and child.get('width') == '100%'
                  ):
                      continue
                  else:
                      layer.append(child)

              root.append(layer)

              for label, index in [
                  ('Mon', 1), ('Wed', 3), ('Fri', 5)
              ]:
                  text = ET.SubElement(root, Q('text'), {
                      'x': '7',
                      'y': str(top + 15 + 22 * index + 14),
                      'font-family': FONT,
                      'font-size': '12',
                      'fill': '#CBD5E1'
                  })
                  text.text = label

              now = datetime.now(timezone.utc).date()
              prior = now - timedelta(days=364)

              years = (
                  str(now.year)
                  if now.year == prior.year
                  else f'{prior.year}–{now.year}'
              )

              footer_y = top + height + 22

              year = ET.SubElement(root, Q('text'), {
                  'x': str(left),
                  'y': str(int(footer_y)),
                  'font-family': FONT,
                  'font-size': '12',
                  'fill': '#C4B5FD'
              })
              year.text = years

              legend_x = left + width - 177

              less = ET.SubElement(root, Q('text'), {
                  'x': str(int(legend_x)),
                  'y': str(int(footer_y)),
                  'font-family': FONT,
                  'font-size': '12',
                  'fill': '#94A3B8'
              })
              less.text = 'Less'

              for i, color in enumerate(PALETTE):
                  ET.SubElement(root, Q('rect'), {
                      'x': str(int(legend_x + 35 + i * 15)),
                      'y': str(int(footer_y - 11)),
                      'width': '12',
                      'height': '12',
                      'rx': '2',
                      'fill': color
                  })

              more = ET.SubElement(root, Q('text'), {
                  'x': str(int(legend_x + 120)),
                  'y': str(int(footer_y)),
                  'font-family': FONT,
                  'font-size': '12',
                  'fill': '#94A3B8'
              })
              more.text = 'More'

              tree.write(
                  path,
                  encoding='utf-8',
                  xml_declaration=True
              )

              print(
                  f'Customized {path} '
                  f'with {len(cells)} visible cells'
              )
          PY

      - name: Publish SVG
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
